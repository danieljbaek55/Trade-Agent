# =============================================================================
# Trade Agent — scheduled paper-trading runs
# =============================================================================
# Two cadences:
#   - DAILY 11:00 AM ET (EDT) / 10:00 AM ET (EST) → full scan + entries
#   - HOURLY 12 PM – 4 PM ET                      → exit checks only
#
# Why split: daily indicators (RSI/MACD/EMA) don't change intraday, so an
# entry scan more than once a day evaluates identical signal state. But
# price-driven exits (stop-loss / take-profit) can trigger anytime, so
# hourly exit checks are genuinely useful.
#
# Cron is in UTC. The slots below stay inside US market hours regardless
# of daylight savings, and the agent's market_is_open() check handles
# holidays / half-days by exiting cleanly.
#
# -----------------------------------------------------------------------------
# Setup (one time):
#   1. Repo → Settings → Secrets and variables → Actions → New repository secret
#        ALPACA_API_KEY     → paper trading key
#        ALPACA_API_SECRET  → paper trading secret
#   2. Workflow file must live on the default branch (main) for cron to fire.
#   3. Actions tab → "Trade Agent" → "Run workflow" to test manually.
# =============================================================================

name: Trade Agent

on:
  schedule:
    # Daily full scan + entries — 15:00 UTC = 11:00 AM EDT / 10:00 AM EST
    - cron: "0 15 * * 1-5"
    # Hourly exit checks — 16:00–20:00 UTC = 12 PM–4 PM EDT (11 AM–3 PM EST)
    - cron: "0 16-20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which command to run"
        required: false
        default: "run"
        type: choice
        options:
          - run
          - exits
          - scan
          - status
          - analytics

permissions:
  contents: read
  actions: read

concurrency:
  group: trade-agent
  cancel-in-progress: false

jobs:
  run:
    name: Run agent
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore portfolio state from previous run
        uses: dawidd6/action-download-artifact@v6
        with:
          name: portfolio-state
          workflow: ${{ github.workflow }}
          if_no_artifact_found: ignore
          path: .

      - name: Decide command
        id: cmd
        run: |
          # Manual trigger uses the input; scheduled runs branch by cron
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "command=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "label=manual (${{ inputs.mode }})" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 15 * * 1-5" ]; then
            echo "command=run" >> "$GITHUB_OUTPUT"
            echo "label=daily scan + entries" >> "$GITHUB_OUTPUT"
          else
            echo "command=exits" >> "$GITHUB_OUTPUT"
            echo "label=hourly exit check" >> "$GITHUB_OUTPUT"
          fi

      - name: Run agent (${{ steps.cmd.outputs.label }})
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          echo "=== ${{ steps.cmd.outputs.label }} ===" | tee run.log
          python main.py ${{ steps.cmd.outputs.command }} 2>&1 | tee -a run.log
          echo "---" | tee -a run.log
          python main.py status 2>&1 | tee -a run.log

      - name: Save portfolio state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-state
          path: portfolio.json
          retention-days: 90
          overwrite: true
          if-no-files-found: ignore

      - name: Save run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: run.log
          retention-days: 30
          if-no-files-found: ignore
